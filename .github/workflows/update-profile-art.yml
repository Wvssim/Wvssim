name: update profile art

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-profile-art.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution heatmap
        env:
          # PROFILE_TOKEN is a classic PAT with the read:user scope.
          # The default GITHUB_TOKEN is repo-scoped and cannot always read a
          # user's contribution calendar, so it is only a fallback.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/make_heatmap.py --login "${{ github.repository_owner }}"

      - name: Render info card
        run: python scripts/make_info_card.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets/)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: refresh profile art"
          git push
